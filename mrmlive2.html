<script>
const $ = id => document.getElementById(id);
/* Network help: STUN is free. Paste TURN details below (e.g. from metered.ca Open Relay) so viewers on strict networks can connect. */
const TURN = { urls: '', username: '', credential: '' };
/* Agora carries the live video worldwide (App ID from console.agora.io) */
const AGORA_APP_ID = '84e348e33b3346b2a29e2e05fdac7b1a';
const ICE = { config: { iceServers: [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:global.stun.twilio.com:3478' },
  ...(TURN.urls ? [TURN] : [])
] } };
/* Scrolling text at the bottom: edit these lines to change what runs on the TV screen. */
const TICKER = [
  'Welcome to the Marriage Conference',
  'Know Your Responsibility',
  'Muwanguzi Restoration Church',
  'Giving: MTN 0774888834 (Rose Mbazira)',
  'Airtel 0709048854 (Rose Mbazira)',
  'Equity Bank A/C 1035203325762 (Muwanguzi Restoration Church)',
  'God bless you for joining us live'
];
function setTicker(items) {
  const track = $('track'); track.replaceChildren();
  const strip = () => { const sp = document.createElement('span'); items.forEach((t, i) => { if (i) { const d = document.createElement('i'); d.textContent = '\u25C6'; sp.append(d); } sp.append(t); }); const d = document.createElement('i'); d.textContent = '\u25C6'; sp.append(d); return sp; };
  track.append(strip(), strip());
  requestAnimationFrame(() => { track.style.setProperty('--dur', Math.max(20, (track.scrollWidth / 2) / 90) + 's'); });
}
setTicker(TICKER);
const AT = +(new URLSearchParams(location.search).get('at')) || 0;
function scene(k) {
  const el = $('scene');
  if (k === 'live') return el.classList.remove('on');
  el.dataset.k = k; $('scenep').textContent = k === 'brb' ? "We\u2019ll be right back" : 'Starting soon'; el.classList.add('on');
}
setInterval(() => { const el = $('scene'); $('cd').textContent = el.classList.contains('on') && el.dataset.k === 'soon' && AT > Date.now() ? fmt((AT - Date.now()) / 1000) : ''; }, 1000);
function gfx(k, a, b, ms) {
  const g = $('gfx'); g.className = 'gfx ' + k; $('gb').textContent = a; $('gs').textContent = b || ''; void g.offsetWidth;
  g.classList.add('in'); clearTimeout(g._t); g._t = setTimeout(() => g.classList.remove('in'), ms || 8000);
}
function floatAmen() {
  const e = document.createElement('i'); e.textContent = '\uD83D\uDE4F'; e.style.right = (12 + Math.random() * 70) + 'px';
  $('floaty').append(e); setTimeout(() => e.remove(), 2700);
}
function onMsg(d) {
  if (!d) return;
  if (d.t === 'state') { setTicker(d.ticker); scene(d.scene); }
  else if (d.t === 'ticker') setTicker(d.items);
  else if (d.t === 'scene') scene(d.s);
  else if (d.t === 'gfx') gfx(d.k, d.a, d.b, d.ms);
  else if (d.t === 'count') { $('cnt').hidden = false; $('cnt').textContent = '\u25CF ' + d.n + ' watching'; }
  else if (d.t === 'amen') floatAmen();
}

const v = $('v'), msg = $('msg');
const params = new URLSearchParams(location.search);
const isHost = params.has('host');
const say = t => { msg.textContent = t; msg.classList.toggle('hide', !t); };
const hostId = room => 'mrmtv-' + room.replace(/[^a-z0-9]/gi,'').toLowerCase();


/* ---------- Saving on the phone (IndexedDB) ---------- */
let _db;
const db = () => _db || (_db = new Promise((res, rej) => {
  const r = indexedDB.open('mrmtv', 1);
  r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('sessions', { keyPath: 'sid' }); d.createObjectStore('chunks', { autoIncrement: true }).createIndex('sid', 'sid'); };
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
}));
const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const dbPut = async (store, val) => { const d = await db(); return req(d.transaction(store, 'readwrite').objectStore(store).put(val)); };
const dbAll = async store => { const d = await db(); return req(d.transaction(store).objectStore(store).getAll()); };
const dbChunks = async sid => { const d = await db(); return req(d.transaction('chunks').objectStore('chunks').index('sid').getAll(IDBKeyRange.only(sid))); };
const dbDelete = async sid => {
  const d = await db(); const t = d.transaction(['sessions', 'chunks'], 'readwrite');
  t.objectStore('sessions').delete(sid);
  const c = t.objectStore('chunks').index('sid').openKeyCursor(IDBKeyRange.only(sid));
  c.onsuccess = () => { const cur = c.result; if (cur) { t.objectStore('chunks').delete(cur.primaryKey); cur.continue(); } };
  return new Promise(res => { t.oncomplete = res; });
};
const fmt = sec => [sec / 3600 | 0, (sec / 60 | 0) % 60, sec % 60 | 0].map(x => String(x).padStart(2, '0')).join(':');

/* ---------- PHONE (broadcaster): open this page with ?host. Works in portrait and landscape. ---------- */
function hostMode() {
  $('panel').hidden = false; say('');
  $('room').value = params.get('room') || '';

  const conns = new Set(), st = { ticker: TICKER.slice(), scene: 'live' };
  const send = m => conns.forEach(c => { try { c.send(m); } catch (e) {} });
  let lastAmen = 0;
  let aclient, aV, aA;
  let stream, peer, facing = 'environment', viewers = new Set(), rec, part = 0, sess, t0, lock, tick, live = false, saveFail = false;
  const watching = () => Math.max(viewers.size, aclient ? Math.max(0, ((aclient.getRTCStats().UserCount) || 1) - 1) : 0);
  async function publishTracks() {
    aV = AgoraRTC.createCustomVideoTrack({ mediaStreamTrack: stream.getVideoTracks()[0], optimizationMode: 'motion', bitrateMax: 1000, bitrateMin: 300 });
    const at = stream.getAudioTracks()[0];
    aA = at ? AgoraRTC.createCustomAudioTrack({ mediaStreamTrack: at, encoderConfig: $('amode').value === 'music' ? 'high_quality_stereo' : 'high_quality' }) : null;
    await aclient.publish([aV, ...(aA ? [aA] : [])]);
  }
  async function republish() { try { await aclient.unpublish(); aV && aV.close(); aA && aA.close(); } catch (e) {} await publishTracks(); }
  async function leaveAgora() { try { aV && aV.close(); aA && aA.close(); await aclient.leave(); } catch (e) {} }
  const agoraErr = e => /DYNAMIC|TOKEN|VENDOR|GATEWAY/i.test(String(e && (e.code || e.message || e))) ? 'Agora needs a token for this project. Paste the Agora token in the box and try again. (' + (e && (e.code || e.message) || e) + ')' : 'Could not connect to the streaming service: ' + (e && (e.code || e.message) || e);
  const pickMime = () => !window.MediaRecorder ? '' : ['video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'].find(t => MediaRecorder.isTypeSupported(t)) || '';
  const show = () => { $('count').textContent = 'Live ' + fmt((Date.now() - t0) / 1000) + ' | Watching: ' + watching() + (!rec ? ' | Not recording (browser cannot record)' : saveFail ? ' | SAVE PROBLEM: phone storage may be full' : ' | Recording saved on this phone'); };

  /* ---- Built-in sound card: filters, noise gate, compressor and limiter, so the sound is clear ---- */
  let ac, raf, raw, gateTimer, nodes = {}, camToolsRef = () => {};
  const PRESETS = {
    speech: { hp: 100, low: -2, mud: -3, pres: 4,   air: 2,   thr: -26, knee: 24, ratio: 3, atk: 0.006, rel: 0.25, make: 1.0, gate: true },
    music:  { hp: 40,  low: 0,  mud: -1, pres: 1.5, air: 1.5, thr: -18, knee: 20, ratio: 2,   atk: 0.015, rel: 0.3,  make: 1.0, gate: false },
    raw:    { hp: 10,  low: 0,  mud: 0,  pres: 0,   air: 0,   thr: 0,   knee: 0,  ratio: 1,   atk: 0.01,  rel: 0.2,  make: 1,   gate: false }
  };
  const preset = () => PRESETS[$('amode').value] || PRESETS.speech;
  const setVol = () => { $('volv').textContent = $('vol').value + '%'; if (nodes.master) nodes.master.gain.value = $('vol').value / 100 * (nodes.makeup || 1); };
  function applyPreset(resetGate) {
    const p = preset(), n = nodes;
    if (n.hp) {
      n.hp.frequency.value = p.hp; n.low.gain.value = p.low; n.mud.gain.value = p.mud; n.pres.gain.value = p.pres; n.air.gain.value = p.air;
      const c = n.comp; c.threshold.value = p.thr; c.knee.value = p.knee; c.ratio.value = p.ratio; c.attack.value = p.atk; c.release.value = p.rel;
      n.makeup = p.make; setVol();
    }
    if (resetGate) $('gate').checked = p.gate;
  }
  function buildChain() {
    ac = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive', sampleRate: 48000 });
    ac.resume().catch(() => {});
    const f = (type, freq, q) => { const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = freq; if (q) b.Q.value = q; return b; };
    const src = ac.createMediaStreamSource(new MediaStream(raw.getAudioTracks()));
    const hp = f('highpass', 100, 0.7), low = f('lowshelf', 120), mud = f('peaking', 300, 1), pres = f('peaking', 3200, 0.9), air = f('highshelf', 9000);
    const sense = ac.createAnalyser(); sense.fftSize = 1024;
    const gate = ac.createGain(), comp = ac.createDynamicsCompressor(), master = ac.createGain(), lim = ac.createDynamicsCompressor();
    lim.threshold.value = -6; lim.knee.value = 0; lim.ratio.value = 20; lim.attack.value = 0.002; lim.release.value = 0.12;
    const out = ac.createAnalyser(); out.fftSize = 512;
    const dest = ac.createMediaStreamDestination();
    src.connect(hp); hp.connect(sense);
    hp.connect(low); low.connect(mud); mud.connect(pres); pres.connect(air); air.connect(gate);
    gate.connect(comp); comp.connect(master); master.connect(lim); const shp = ac.createWaveShaper(), curve = new Float32Array(1024);
    for (let i = 0; i < 1024; i++) { const x = i / 512 - 1; curve[i] = Math.tanh(x * 1.3) / Math.tanh(1.3); }
    shp.curve = curve; shp.oversample = '2x';   /* soft clipper: rounds off peaks so loud sounds do not crackle */
    lim.connect(shp); shp.connect(out); shp.connect(dest);
    nodes = { hp, low, mud, pres, air, comp, master };
    /* gentle noise gate: learns the room's background level and lowers the sound when nobody is speaking */
    const buf = new Float32Array(sense.fftSize); let floor = -60, hold = 0;
    gateTimer = setInterval(() => {
      sense.getFloatTimeDomainData(buf); let sum = 0; for (const x of buf) sum += x * x;
      const db = 10 * Math.log10(sum / buf.length + 1e-12);
      floor = Math.min(floor + 0.02, db);
      const thr = Math.max(-62, Math.min(-36, floor + 10));
      if (db > thr) hold = 8; else if (hold > 0) hold--;
      const open = !$('gate').checked || hold > 0;
      gate.gain.setTargetAtTime(open ? 1 : 0.3, ac.currentTime, open ? 0.015 : 0.2);
    }, 40);
    /* level bar shows the processed sound that viewers hear */
    const lv = new Uint8Array(out.fftSize), bar = $('meter').firstElementChild;
    $('meter').hidden = false;
    const loop = () => { out.getByteTimeDomainData(lv); let m = 0; for (const x of lv) m = Math.max(m, Math.abs(x - 128)); bar.style.width = Math.min(100, m / 128 * 100) + '%'; bar.style.background = m > 120 ? '#ff3b30' : m > 90 ? '#ffcc00' : '#4cd964'; raf = requestAnimationFrame(loop); };
    loop();
    return dest.stream.getAudioTracks()[0];
  }
  function teardown() {
    clearInterval(gateTimer); cancelAnimationFrame(raf);
    if (raw) raw.getTracks().forEach(t => t.stop());
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (ac) { ac.close().catch(() => {}); ac = null; }
    nodes = {};
  }

  async function refreshMics(ask) {
    try { if (ask) (await navigator.mediaDevices.getUserMedia({ audio: true })).getTracks().forEach(t => t.stop()); } catch (e) {}
    let list = []; try { list = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audioinput'); } catch (e) {}
    const cur = $('mic').value;
    $('mic').replaceChildren(new Option('Sound input: automatic (phone or plugged-in sound card)', ''));
    list.forEach((d, i) => $('mic').append(new Option(d.label || 'Sound input ' + (i + 1), d.deviceId)));
    if ([...$('mic').options].some(o => o.value === cur)) $('mic').value = cur;
  }
  try { const m = localStorage.getItem('mrmtv-amode'); if (m && PRESETS[m]) $('amode').value = m; } catch (e) {}
  $('gate').checked = preset().gate; setVol();
  $('amode').onchange = () => { try { localStorage.setItem('mrmtv-amode', $('amode').value); } catch (e) {} applyPreset(true); };
  $('vol').oninput = setVol;
  refreshMics(true);
  if (navigator.mediaDevices.addEventListener) navigator.mediaDevices.addEventListener('devicechange', () => { if (!live) refreshMics(false); });

  async function getCam() {
    teardown();
    const mode = $('amode').value, mic = $('mic').value;
    const audio = exact => ({
      ...(exact && mic ? { deviceId: { exact: mic } } : {}),
      echoCancellation: mode === 'speech', noiseSuppression: mode === 'speech', autoGainControl: false,
      ...(mode === 'music' ? { channelCount: { ideal: 2 }, sampleRate: { ideal: 48000 } } : {}) });
    const video = { facingMode: facing, width: { ideal: 960 }, height: { ideal: 540 }, frameRate: { ideal: 24 } };
    try { raw = await navigator.mediaDevices.getUserMedia({ video, audio: audio(true) }); }
    catch (e) { raw = await navigator.mediaDevices.getUserMedia({ video, audio: audio(false) }); }
    let at; try { at = buildChain(); } catch (e) { at = raw.getAudioTracks()[0]; }
    stream = new MediaStream([...raw.getVideoTracks(), ...(at ? [at] : [])]);
    v.srcObject = stream;
    applyPreset(false);
    try { camToolsRef(); } catch (e) {}
  }

  function startRec() {
    if (!window.MediaRecorder) return;
    const p = ++part, mime = pickMime(); let n = 0;
    try { rec = new MediaRecorder(stream, { mimeType: mime || undefined, videoBitsPerSecond: +$('quality').value, audioBitsPerSecond: 48000 }); } catch (e) { rec = null; return; }
    sess.mime = rec.mimeType || mime;
    rec.ondataavailable = e => {
      if (!e.data || !e.data.size) return;
      sess.bytes += e.data.size; sess.end = Date.now(); sess.parts = p;
      dbPut('chunks', { sid: sess.sid, part: p, n: n++, blob: e.data }).then(() => dbPut('sessions', sess)).catch(() => { saveFail = true; });
    };
    rec.start(5000);
  }
  const stopRec = () => new Promise(res => {
    if (!rec || rec.state === 'inactive') return res();
    rec.onstop = () => setTimeout(res, 600); rec.stop();
  });

  $('start').onclick = async () => {
    const room = $('room').value.trim();
    const hostToken = $('agtok').value.trim() || params.get('tk') || null;
    if (room.length < 4) return alert('Use a room code of at least 4 letters or numbers.');
    try { await getCam(); } catch (e) { return alert('Camera blocked. Allow camera and microphone, then try again.'); }
    try {
      aclient = AgoraRTC.createClient({ mode: 'live', codec: 'vp8' });
      await aclient.setClientRole('host');
      await aclient.join(AGORA_APP_ID, hostId(room), hostToken, null);
      await publishTracks();
    } catch (e) { try { await leaveAgora(); } catch (x) {} teardown(); return alert(agoraErr(e)); }
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    sess = { sid: String(Date.now()), start: Date.now(), end: Date.now(), bytes: 0, parts: 0, mime: '', ended: false };
    startRec(); dbPut('sessions', sess).catch(() => { saveFail = true; });
    try { lock = await navigator.wakeLock.request('screen'); } catch (e) {}
    /* PeerJS now only carries small text messages (scrolling text, graphics, Amen); the video goes through Agora */
    peer = new Peer(hostId(room), ICE);
    peer.on('error', () => {});
    peer.on('connection', conn => conn.on('open', () => {
      viewers.add(conn.peer); conns.add(conn);
      conn.send({ t: 'state', ticker: st.ticker, scene: st.scene });
      conn.on('data', d => { if (d && d.t === 'amen' && Date.now() - lastAmen > 80) { lastAmen = Date.now(); send({ t: 'amen' }); floatAmen(); } });
      conn.on('close', () => { viewers.delete(conn.peer); conns.delete(conn); });
    }));
    live = true; t0 = Date.now();
    $('live').hidden = false; $('start').hidden = true; $('flip').hidden = false; $('share').hidden = false; $('stop').hidden = false;
    $('reclink').hidden = true; $('room').hidden = true; $('agtok').hidden = true; $('quality').hidden = true; $('mic').hidden = true;
    $('tools').hidden = false; $('ctl').hidden = false; $('atl').hidden = true;
    show(); let k = 0; tick = setInterval(() => { show(); $('cnt').hidden = false; $('cnt').textContent = '\u25CF ' + watching() + ' watching'; if (++k % 3 === 0) send({ t: 'count', n: watching() }); }, 1000);

    $('share').onclick = () => {
      let link = location.origin + location.pathname + '?room=' + encodeURIComponent(room);
      if ($('at').value) { const [h, m] = $('at').value.split(':'), d = new Date(); d.setHours(+h, +m, 0, 0); if (d < Date.now()) d.setDate(d.getDate() + 1); link += '&at=' + d.getTime(); }
      open('https://wa.me/?text=' + encodeURIComponent('Watch MRM TV live: ' + link + (hostToken ? '&tk=' + encodeURIComponent(hostToken) : '')));
    };
  };

  $('flip').onclick = async () => {
    facing = facing === 'environment' ? 'user' : 'environment';
    await stopRec();
    await getCam();
    startRec();
    await republish();
  };

  $('stop').onclick = async () => {
    if (!confirm('End the live and save the recording?')) return;
    live = false; clearInterval(tick);
    await stopRec(); sess.ended = true; sess.end = Date.now();
    await dbPut('sessions', sess).catch(() => {});
    await leaveAgora(); teardown();
    try { peer.destroy(); } catch (e) {}
    try { lock && lock.release(); } catch (e) {} lock = null;
    location.search = '?recordings';
  };

  try { const sv = JSON.parse(localStorage.getItem('mrmtv-ticker') || 'null'); if (sv && sv.length) { st.ticker = sv; setTicker(sv); } } catch (e) {}
  $('tk').value = st.ticker.join('\n');
  $('tkset').onclick = () => {
    const items = $('tk').value.split('\n').map(x => x.trim()).filter(Boolean); if (!items.length) return;
    st.ticker = items; setTicker(items); send({ t: 'ticker', items });
    try { localStorage.setItem('mrmtv-ticker', JSON.stringify(items)); } catch (e) {}
  };
  $('gshow').onclick = () => { const k = $('gk').value, a = $('g1').value.trim(), b = $('g2').value.trim(); if (!a) return; send({ t: 'gfx', k, a, b, ms: 8000 }); gfx(k, a, b, 8000); };
  document.querySelectorAll('[data-sc]').forEach(b => { b.onclick = () => { st.scene = b.dataset.sc; send({ t: 'scene', s: st.scene }); scene(st.scene); }; });
  $('ctl').onclick = () => { $('panel').hidden = !$('panel').hidden; };
  function camTools() {
    const t = raw.getVideoTracks()[0], c = (t.getCapabilities && t.getCapabilities()) || {}, z = $('zoom');
    $('camd').hidden = !(c.zoom || c.torch); z.hidden = !c.zoom; $('torch').hidden = !c.torch;
    if (c.zoom) { z.min = c.zoom.min; z.max = Math.min(c.zoom.max, c.zoom.min * 8); z.step = c.zoom.step || 0.1; z.value = c.zoom.min; z.oninput = () => t.applyConstraints({ advanced: [{ zoom: +z.value }] }).catch(() => {}); }
    let on = false; $('torch').textContent = 'Torch on';
    $('torch').onclick = () => { on = !on; t.applyConstraints({ advanced: [{ torch: on }] }).catch(() => {}); $('torch').textContent = on ? 'Torch off' : 'Torch on'; };
  }
  camToolsRef = camTools;
  document.addEventListener('visibilitychange', async () => {
    if (lock && document.visibilityState === 'visible') { try { lock = await navigator.wakeLock.request('screen'); } catch (e) {} }
  });
  addEventListener('beforeunload', e => { if (live) { e.preventDefault(); e.returnValue = ''; } });
}

/* ---------- SAVED LIVE SESSIONS: open this page with ?recordings ---------- */
async function recView() {
  document.querySelectorAll('.stage > :not(#recs)').forEach(e => { e.hidden = true; });
  const box = $('recs'); box.hidden = false; box.replaceChildren();
  const add = (tag, text, parent) => { const el = document.createElement(tag); el.textContent = text; (parent || box).append(el); return el; };
  add('h2', 'Saved live sessions').style.margin = '0 0 6px';
  add('p', 'These are stored on this phone only. Download the ones you want to keep.').className = 'small';
  const back = add('a', 'Back to broadcaster'); back.href = location.pathname + '?host';
  let list = [];
  try { list = (await dbAll('sessions')).sort((x, y) => y.start - x.start); } catch (e) {}
  if (!list.length) add('p', 'No saved sessions yet.').style.marginTop = '16px';
  const blobOf = async (s, p) => {
    const chunks = (await dbChunks(s.sid)).filter(c => c.part === p).sort((x, y) => x.n - y.n);
    return new Blob(chunks.map(c => c.blob), { type: (s.mime || 'video/webm').split(';')[0] });
  };
  list.forEach(s => {
    const card = document.createElement('div'); card.className = 'rec'; box.append(card);
    add('b', 'Live on ' + new Date(s.start).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }), card);
    add('div', fmt((s.end - s.start) / 1000) + ' | ' + (s.bytes / 1048576).toFixed(0) + ' MB' + (s.ended ? '' : ' | ended unexpectedly (saved up to the last few seconds)'), card).className = 'small';
    const row = document.createElement('div'); row.className = 'row'; card.append(row);
    for (let p = 1; p <= Math.max(1, s.parts); p++) {
      const tag = s.parts > 1 ? ' part ' + p : '';
      const ext = (s.mime || '').includes('mp4') ? 'mp4' : 'webm';
      const play = add('button', 'Play' + tag, row);
      play.onclick = async () => {
        const old = card.querySelector('video'); if (old) old.remove();
        const vid = document.createElement('video'); vid.controls = true; vid.playsInline = true;
        vid.src = URL.createObjectURL(await blobOf(s, p)); card.append(vid); vid.play().catch(() => {});
      };
      const dl = add('button', 'Download' + tag, row); dl.className = 'sec';
      dl.onclick = async () => {
        const a = document.createElement('a'); a.href = URL.createObjectURL(await blobOf(s, p));
        const d = new Date(s.start), z = n => String(n).padStart(2, '0');
        a.download = 'mrm-live-' + d.getFullYear() + z(d.getMonth() + 1) + z(d.getDate()) + '-' + z(d.getHours()) + z(d.getMinutes()) + (s.parts > 1 ? '-part' + p : '') + '.' + ext;
        document.body.append(a); a.click(); a.remove();
      };
    }
    const del = add('button', 'Delete', row); del.className = 'sec';
    del.onclick = async () => { if (confirm('Delete this recording from the phone?')) { await dbDelete(s.sid); recView(); } };
  });
}

/* ---------- VIEWERS (WhatsApp link): open this page normally ---------- */
function viewerMode() {
  const room = params.get('room');
  if (!room) return say('Open the link shared in the WhatsApp group.');
  say('Connecting to the live session…');
  let peer, vconn, client; const ms = new MediaStream();
  $('splash').hidden = false;
  const refresh = () => {
    v.srcObject = new MediaStream(ms.getTracks());
    if (ms.getVideoTracks().length) { say(''); scene('live'); $('live').hidden = false; $('unmute').hidden = !v.muted; v.play().catch(() => {}); }
    else { $('live').hidden = true; say(''); scene('soon'); }
  };
  (async () => {
    try {
      client = AgoraRTC.createClient({ mode: 'live', codec: 'vp8' });
      await client.setClientRole('audience');
      client.on('user-published', async (user, type) => {
        await client.subscribe(user, type);
        const t = (type === 'video' ? user.videoTrack : user.audioTrack).getMediaStreamTrack();
        ms.getTracks().filter(x => x.kind === t.kind).forEach(x => ms.removeTrack(x)); ms.addTrack(t); refresh();
      });
      client.on('user-unpublished', (user, type) => { ms.getTracks().filter(x => x.kind === type).forEach(x => ms.removeTrack(x)); refresh(); });
      await client.join(AGORA_APP_ID, hostId(room), params.get('tk') || null, null);
      refresh();
    } catch (e) { say(/DYNAMIC|TOKEN|VENDOR|GATEWAY/i.test(String(e && (e.code || e.message))) ? 'This stream is not set up correctly (Agora App ID).' : 'Could not connect. Check your internet and refresh the page.'); }
  })();
  /* small text messages (scrolling text, graphics, Amen) travel on a separate best-effort connection */
  function connectData() {
    try {
      peer = new Peer(undefined, ICE);
      const again = ms2 => setTimeout(() => { try { peer.destroy(); } catch (e) {} connectData(); }, ms2);
      peer.on('open', () => {
        const conn = vconn = peer.connect(hostId(room)); conn.on('data', onMsg);
        conn.on('open', () => { $('amen').hidden = false; });
        conn.on('close', () => { $('amen').hidden = true; again(5000); });
      });
      peer.on('error', () => again(8000));
    } catch (e) {}
  }
  connectData();
  $('amen').onclick = () => { if (Date.now() - (window._a || 0) < 700) return; window._a = Date.now(); try { vconn.send({ t: 'amen' }); } catch (e) {} };
  $('unmute').onclick = () => { v.muted = false; $('unmute').hidden = true; };
}

/* start the right screen (after everything above is defined) */
if (params.has('recordings')) recView(); else if (isHost) hostMode(); else viewerMode();
</script>
